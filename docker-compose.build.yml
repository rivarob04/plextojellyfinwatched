# Same as docker-compose.yml, but builds the image from this repository
# instead of pulling it: docker compose -f docker-compose.build.yml up -d --build
services:
  jellyplex-watched:
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: plextojellyfinwatched:local
    container_name: jellyplex-watched
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Toronto}
      GUI_PASSWORD: ${GUI_PASSWORD:?Set GUI_PASSWORD in the stack environment}
    ports:
      - "${GUI_PORT_HOST:-8787}:8787"
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config

name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < packaging/windows/VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          uv venv --python 3.13 .venv
          uv sync --frozen --no-dev
          uv pip install pyinstaller pywebview

      - name: Build app
        run: .venv\Scripts\pyinstaller.exe --noconfirm packaging\windows\jellyplex-watched.spec

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\JellyPlex-Watched\JellyPlex-Watched.exe" -ArgumentList "--smoke" -Wait -PassThru
          $result = Join-Path $env:APPDATA "JellyPlex-Watched\smoke-result.json"
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          .venv\Scripts\python.exe -c "import webview, clr; print('pywebview', webview.__version__ if hasattr(webview, '__version__') else 'ok')"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\JellyPlex-Watched\* -DestinationPath "dist\JellyPlex-Watched-Portable-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: JellyPlex-Watched-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/JellyPlex-Watched-Setup-*.exe
            dist/JellyPlex-Watched-Portable-*.zip

      - name: Publish release
        # Publishes (or refreshes) the release named after packaging/windows/VERSION.
        # Bump that file to cut a new release.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: JellyPlex-Watched ${{ steps.version.outputs.version }} for Windows
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: |
            dist/JellyPlex-Watched-Setup-*.exe
            dist/JellyPlex-Watched-Portable-*.zip

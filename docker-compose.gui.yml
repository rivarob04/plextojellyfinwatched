# Run the JellyPlex-Watched GUI in Docker.
#   docker compose -f docker-compose.gui.yml up -d --build
# Then open http://<host>:8787 (log in with any username + GUI_PASSWORD).
services:
  jellyplex-watched-gui:
    build:
      context: .
      dockerfile: Dockerfile.slim
    container_name: jellyplex-watched-gui
    restart: unless-stopped
    command: ["python", "-u", "gui.py"]
    environment:
      - PUID=1000
      - PGID=1000
      - YAML_FILE=/app/config/config.yaml
      - GUI_HOST=0.0.0.0
      - GUI_PORT=8787
      - GUI_NO_BROWSER=1
      - GUI_PASSWORD=change-me   # required when reachable from the network
    ports:
      - "8787:8787"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
